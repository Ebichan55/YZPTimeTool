<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>相手着弾計算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav-bar">
    <a href="index.html">メニュー</a>
    <a href="enemy_list.html">相手リスト</a>
    <a href="calc.html">相手着弾計算</a>
    <a href="ally_list.html">味方リスト</a>
    <a href="ally_sync.html">差し込み計算</a>
  </nav>

  <h1>相手着弾計算</h1>

  <section>
    <h2>現在の UTC 時刻</h2>
    <div id="utc-clock" class="clock"></div>
  </section>

  <section>
    <h2>UTC補正（秒）</h2>
    <input type="number" id="utc-offset" placeholder="例：+40 / -20">
    <button class="btn" onclick="saveOffset()">補正を保存</button>
  </section>

  <section>
    <h2>敵一覧</h2>
    <div id="calc-list"></div>
  </section>

  <script src="server_time.js"></script>
  <script>

    const enemies = JSON.parse(localStorage.getItem("enemies") || "[]");
    const listDiv = document.getElementById("calc-list");

    // 秒 → MMSS
    function secToMMSS(sec) {
      sec = ((sec % 3600) + 3600) % 3600;
      const mm = String(Math.floor(sec / 60)).padStart(2, "0");
      const ss = String(sec % 60).padStart(2, "0");
      return mm + ss;
    }

    // 補正後UTC時計
    function updateUTC() {
      const now = getServerNow();
      const date = new Date(now * 1000);

      document.getElementById("utc-clock").textContent =
        date.toISOString().slice(11, 19) + " (UTC)";
    }
    setInterval(updateUTC, 1000);
    updateUTC();

    // 補正値保存
    function saveOffset() {
      const v = Number(document.getElementById("utc-offset").value);
      setOffset(v);
      alert("補正値を追加しました");
    }


    // 敵一覧
    enemies.forEach((e, index) => {
      const row = document.createElement("div");
      row.className = "enemy-card";

      row.innerHTML = `
        <p><b>${e.name}</b>（行軍 ${e.march}秒）</p>
        <input type="text" id="remain-${index}" placeholder="残り時間 MMSS">
        <button class="btn calc" onclick="calcHit(${index})">計算</button>
        <p id="result-${index}" class="result"></p>
      `;

      listDiv.appendChild(row);
    });

    // 計算（補正後UTC基準）
    function calcHit(index) {
      const e = enemies[index];
      const mmss = document.getElementById(`remain-${index}`).value;
      const result = document.getElementById(`result-${index}`);

      if (mmss.length !== 4) {
        result.textContent = "MMSS形式で入力";
        return;
      }

      const mm = Number(mmss.slice(0, 2));
      const ss = Number(mmss.slice(2, 4));
      const remainSec = mm * 60 + ss;

      const now = getServerNow();
      const date = new Date(now * 1000);
      const nowSec = date.getUTCMinutes() * 60 + date.getUTCSeconds();

      const hitRemain = remainSec + e.march;
      const hitUTCsec = nowSec + hitRemain;

      const hitUTC = secToMMSS(hitUTCsec);

      result.textContent = `着弾UTC：${hitUTC}`;
    }
  </script>

</body>
</html>
