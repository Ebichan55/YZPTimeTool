<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>相手着弾計算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav-bar">
    <a href="index.html">メニュー</a>
    <a href="enemy_list.html">相手リスト</a>
    <a href="calc.html">相手着弾計算</a>
    <a href="ally_list.html">味方リスト</a>
    <a href="ally_sync.html">差し込み計算</a>
    <a href="settings.html">設定</a>
  </nav>

  <h1>相手着弾計算</h1>

  <section>
    <h2>現在の UTC 時刻（MMSS）</h2>
    <p>※UTCは手動でMMSS形式で入力してください。</p>
    <input type="text" id="utc-manual" placeholder="例：0130">
  </section>


  <section>
    <h2>敵一覧</h2>
    <div id="calc-list"></div>
  </section>

  <script>
    function loadBackgroundState() {
      const bgEnabled = localStorage.getItem("backgroundEnabled");
      if (bgEnabled === "false") {
        document.body.classList.add("bg-off");
      }
    }
    loadBackgroundState();

    const enemies = JSON.parse(localStorage.getItem("enemies") || "[]");
    const listDiv = document.getElementById("calc-list");

    // 秒 → MMSS
    function secToMMSS(sec) {
      sec = ((sec % 3600) + 3600) % 3600;
      const mm = String(Math.floor(sec / 60)).padStart(2, "0");
      const ss = String(sec % 60).padStart(2, "0");
      return mm + ss;
    }

    // 手動UTC入力を使用する（MMSS）


    // 敵一覧
    enemies.forEach((e, index) => {
      const row = document.createElement("div");
      row.className = "enemy-card";

      row.innerHTML = `
        <p><b>${e.name}</b>（行軍 ${e.march}秒）</p>
        <input type="text" id="remain-${index}" placeholder="残り時間 MMSS">
        <button class="btn calc" onclick="calcHit(${index})">計算</button>
        <p id="result-${index}" class="result"></p>
      `;

      listDiv.appendChild(row);
    });

    // 計算（補正後UTC基準）
    function calcHit(index) {
      const e = enemies[index];
      const mmss = document.getElementById(`remain-${index}`).value;
      const result = document.getElementById(`result-${index}`);

      if (mmss.length !== 4) {
        result.textContent = "MMSS形式で入力";
        return;
      }

      const mm = Number(mmss.slice(0, 2));
      const ss = Number(mmss.slice(2, 4));
      const remainSec = mm * 60 + ss;

      // manual UTC MMSS -> seconds
      const manual = document.getElementById("utc-manual").value;
      if (manual.length !== 4) {
        result.textContent = "現在のUTCをMMSS形式で入力してください";
        return;
      }
      const nowMM = Number(manual.slice(0, 2));
      const nowSS = Number(manual.slice(2, 4));
      const nowSec = nowMM * 60 + nowSS;

      const hitRemain = remainSec + e.march;
      const hitUTCsec = nowSec + hitRemain;

      const hitUTC = secToMMSS(hitUTCsec);

      result.textContent = `着弾UTC：${hitUTC}`;
    }
  </script>

</body>
</html>
