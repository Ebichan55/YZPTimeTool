<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>敵リスト管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <nav class="nav-bar">
    <a href="index.html">メニュー</a>
    <a href="enemy_list.html">相手リスト</a>
    <a href="calc.html">相手着弾計算</a>
    <a href="ally_list.html">味方リスト</a>
    <a href="ally_sync.html">差し込み計算</a>
    <a href="settings.html">設定</a>
  </nav>
  <h1>相手リスト管理</h1>

  <section>
    <h2>相手を追加</h2>
    <input type="text" id="enemy-name" placeholder="敵名">
    <input type="number" id="enemy-march" placeholder="行軍時間（秒）">
    <button id="add" class="btn">追加</button>
  </section>

  <section>
    <h2>登録済みの相手</h2>
    <div id="enemy-list"></div>
  </section>

  <section>
    <a href="calc.html" class="btn calc">計算ページへ</a>
  </section>

  <script>
    function loadBackgroundState() {
      const bgEnabled = localStorage.getItem("backgroundEnabled");
      if (bgEnabled === "false") {
        document.body.classList.add("bg-off");
      }
    }
    loadBackgroundState();

    function loadEnemies() {
      const list = JSON.parse(localStorage.getItem("enemies") || "[]");
      const div = document.getElementById("enemy-list");
      div.innerHTML = "";

      list.forEach((e, index) => {
        div.innerHTML += `
          <div class="enemy-card">
            <p>${e.name}（${e.march}秒）</p>
            <button class="btn delete" onclick="deleteEnemy(${index})">削除</button>
          </div>
        `;
      });
    }

    function deleteEnemy(index) {
      const list = JSON.parse(localStorage.getItem("enemies") || "[]");
      list.splice(index, 1);
      localStorage.setItem("enemies", JSON.stringify(list));
      loadEnemies();
    }

    document.getElementById("add").onclick = () => {
      const name = document.getElementById("enemy-name").value;
      const march = Number(document.getElementById("enemy-march").value);

      if (!name || march <= 0) return;

      const list = JSON.parse(localStorage.getItem("enemies") || "[]");
      list.push({ name, march });
      localStorage.setItem("enemies", JSON.stringify(list));

      document.getElementById("enemy-name").value = "";
      document.getElementById("enemy-march").value = "";
      loadEnemies();
    };

    loadEnemies();
  </script>

</body>
</html>
