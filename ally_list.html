<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>味方リスト管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <nav class="nav-bar">
    <a href="index.html">メニュー</a>
    <a href="enemy_list.html">相手リスト</a>
    <a href="ally_list.html">味方リスト</a>
    <a href="calc.html">着弾計算</a>
    <a href="ally_sync.html">差し込み計算</a>
    <a href="settings.html">設定</a>
  </nav>
  <h1>味方リスト管理</h1>


  <section>
    <input type="text" id="ally-name" placeholder="味方名">
    <input type="number" id="ally-march" placeholder="行軍時間（秒）">
    <label>
      <input type="checkbox" id="ally-gathering">
      集結主
    </label>
    <label>
      <input type="checkbox" id="ally-switch-leader">
      スイッチ基準主
    </label>
    <div class="ally-add-row">
      <button id="add" class="btn">追加</button>
      <button id="sort-allies" class="btn sort-btn" type="button" title="並び替え">↕</button>
    </div>
  </section>

  <section>
    <h2>登録済みの味方</h2>
    <div id="ally-list"></div>
  </section>

  <script>
    let editingAllyIndex = null;

    function getAutoTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function getAutoDeviceMode() {
      return window.innerWidth <= 768 ? "mobile" : "desktop";
    }

    function applyThemeMode(mode) {
      const selected = mode || "auto";
      const effective = selected === "auto" ? getAutoTheme() : selected;
      document.body.dataset.theme = effective;
    }

    function applyDeviceMode(mode) {
      const selected = mode || "auto";
      const effective = selected === "auto" ? getAutoDeviceMode() : selected;
      document.body.dataset.device = effective;
    }

    function loadBackgroundState() {
      const bgEnabled = localStorage.getItem("backgroundEnabled");
      document.body.classList.toggle("bg-off", bgEnabled === "false");
      const savedTheme = localStorage.getItem("themeMode") || "auto";
      const savedDevice = localStorage.getItem("deviceMode") || "auto";
      applyThemeMode(savedTheme);
      applyDeviceMode(savedDevice);
    }
    loadBackgroundState();
    window.addEventListener("resize", () => {
      if ((localStorage.getItem("themeMode") || "auto") === "auto") {
        applyThemeMode("auto");
      }
      if ((localStorage.getItem("deviceMode") || "auto") === "auto") {
        applyDeviceMode("auto");
      }
    });

    function sortAllies() {
      const list = JSON.parse(localStorage.getItem("allies") || "[]");
      const sorted = [...list].sort((a, b) => {
        const rankA = a.gatheringLeader && a.switchLeader ? 0 : a.gatheringLeader ? 1 : 2;
        const rankB = b.gatheringLeader && b.switchLeader ? 0 : b.gatheringLeader ? 1 : 2;
        if (rankA !== rankB) return rankA - rankB;
        return (a.name || "").localeCompare(b.name || "", "ja");
      });

      localStorage.setItem("allies", JSON.stringify(sorted));
      loadAllies();
    }

    function loadAllies() {
      const list = JSON.parse(localStorage.getItem("allies") || "[]");
      const div = document.getElementById("ally-list");
      div.innerHTML = "";

      list.forEach((a, index) => {
        div.innerHTML += `
          <div class="list-card enemy-card">
            <div class="list-card-main">
              <p class="entry-name">${a.name}</p>
              <p class="entry-meta">行軍 ${a.march}秒</p>
              <label class="entry-meta">
                <input type="checkbox" ${a.gatheringLeader ? "checked" : ""} onchange="toggleGatheringLeader(${index}, this.checked)">
                集結主
              </label>
              <label class="entry-meta">
                <input type="checkbox" ${a.switchLeader ? "checked" : ""} onchange="toggleSwitchLeader(${index}, this.checked)">
                スイッチ基準主
              </label>
            </div>
            <div class="action-buttons">
              <button class="btn edit" onclick="editAlly(${index})">編集</button>
              <button class="btn delete" onclick="deleteAlly(${index})">削除</button>
            </div>
          </div>
        `;
      });
    }

    function toggleGatheringLeader(index, checked) {
      const list = JSON.parse(localStorage.getItem("allies") || "[]");
      if (!list[index]) return;
      list[index].gatheringLeader = checked;
      localStorage.setItem("allies", JSON.stringify(list));
      loadAllies();
    }

    function toggleSwitchLeader(index, checked) {
      const list = JSON.parse(localStorage.getItem("allies") || "[]");
      if (!list[index]) return;

      list[index].switchLeader = checked;
      localStorage.setItem("allies", JSON.stringify(list));
      loadAllies();
    }

    function editAlly(index) {
      const list = JSON.parse(localStorage.getItem("allies") || "[]");
      const item = list[index];
      if (!item) return;

      editingAllyIndex = index;
      document.getElementById("ally-name").value = item.name;
      document.getElementById("ally-march").value = item.march;
      document.getElementById("ally-gathering").checked = Boolean(item.gatheringLeader);
      document.getElementById("ally-switch-leader").checked = Boolean(item.switchLeader);
      document.getElementById("add").textContent = "更新";
      document.getElementById("ally-name").focus();
    }

    function deleteAlly(index) {
      const list = JSON.parse(localStorage.getItem("allies") || "[]");
      list.splice(index, 1);
      localStorage.setItem("allies", JSON.stringify(list));

      if (editingAllyIndex === index) {
        editingAllyIndex = null;
        document.getElementById("add").textContent = "追加";
      }

      document.getElementById("ally-name").value = "";
      document.getElementById("ally-march").value = "";
      document.getElementById("ally-gathering").checked = false;
      document.getElementById("ally-switch-leader").checked = false;
      loadAllies();
    }

    document.getElementById("add").onclick = () => {
      const name = document.getElementById("ally-name").value;
      const march = Number(document.getElementById("ally-march").value);
      const gatheringLeader = document.getElementById("ally-gathering").checked;
      const switchLeader = document.getElementById("ally-switch-leader").checked;

      if (!name || march <= 0) return;

      const list = JSON.parse(localStorage.getItem("allies") || "[]");
      const entry = { name, march, gatheringLeader, switchLeader };

      if (editingAllyIndex !== null) {
        list[editingAllyIndex] = entry;
      } else {
        list.push(entry);
      }

      localStorage.setItem("allies", JSON.stringify(list));

      document.getElementById("ally-name").value = "";
      document.getElementById("ally-march").value = "";
      document.getElementById("ally-gathering").checked = false;
      document.getElementById("ally-switch-leader").checked = false;
      editingAllyIndex = null;
      document.getElementById("add").textContent = "追加";
      loadAllies();
    };

    document.getElementById("sort-allies").onclick = sortAllies;

    loadAllies();
  </script>

</body>
</html>
