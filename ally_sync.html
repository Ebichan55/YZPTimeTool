<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>味方同期計算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <nav class="nav-bar">
    <a href="index.html">メニュー</a>
    <a href="enemy_list.html">相手リスト</a>
    <a href="calc.html">相手着弾計算</a>
    <a href="ally_list.html">味方リスト</a>
    <a href="ally_sync.html">差し込み計算</a>
    <a href="settings.html">設定</a>
  </nav>
  <h1>味方差し込み計算</h1>

  <section>
    <h2>相手の着弾UTC（MMSS）</h2>
    <input type="text" id="enemy-hit" placeholder="例：0455">
  </section>

  <section>
    <button id="calc" class="btn calc">計算する</button>
  </section>

  <section>
    <h2>味方の出発UTC</h2>
    <div id="result"></div>
  </section>

  <script>
    function loadBackgroundState() {
      const bgEnabled = localStorage.getItem("backgroundEnabled");
      if (bgEnabled === "false") {
        document.body.classList.add("bg-off");
      }
    }
    loadBackgroundState();

    const allies = JSON.parse(localStorage.getItem("allies") || "[]");

    function secToMMSS(sec) {
      sec = ((sec % 3600) + 3600) % 3600;
      const mm = String(Math.floor(sec / 60)).padStart(2, "0");
      const ss = String(sec % 60).padStart(2, "0");
      return mm + ss;
    }

    document.getElementById("calc").onclick = () => {
      const result = document.getElementById("result");
      result.innerHTML = "";

      if (allies.length === 0) {
        result.innerHTML = "味方が登録されていません。味方リストで登録してください。";
        return;
      }

      const mmss = document.getElementById("enemy-hit").value.trim();
      const normalized = mmss.replace(/\D/g, "");
      if (normalized.length !== 4) {
        result.innerHTML = "MMSS形式で入力してください";
        return;
      }

      const mm = Number(normalized.slice(0, 2));
      const ss = Number(normalized.slice(2, 4));
      const enemyHitSec = mm * 60 + ss;

      allies.forEach(a => {
        const departSec = enemyHitSec - a.march;
        const departMMSS = secToMMSS(departSec);

        result.innerHTML += `
          <p>${a.name} → 出発UTC：${departMMSS}</p>
        `;
      });
    };
  </script>

</body>
</html>
