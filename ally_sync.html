<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>味方同期計算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <nav class="nav-bar">
    <a href="index.html">メニュー</a>
    <a href="enemy_list.html">相手リスト</a>
    <a href="ally_list.html">味方リスト</a>
    <a href="calc.html">相手着弾計算</a>
    <a href="ally_sync.html">差し込み計算</a>
    <a href="settings.html">設定</a>
  </nav>
  <h1>味方差し込み計算</h1>

  <section>
    <h2>相手の着弾UTC（MMSS）</h2>
    <input type="text" id="enemy-hit" placeholder="例：0455">
  </section>

  <section>
    <button id="calc" class="btn calc">計算する</button>
  </section>

  <section>
    <button id="copy-sync" class="btn copy" type="button">クリップボードにコピー</button>
  </section>

  <section>
    <h2>味方の出発UTC</h2>
    <div id="result"></div>
  </section>

  <script>
    function getAutoTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function getAutoDeviceMode() {
      return window.innerWidth <= 768 ? "mobile" : "desktop";
    }

    function applyThemeMode(mode) {
      const selected = mode || "auto";
      const effective = selected === "auto" ? getAutoTheme() : selected;
      document.body.dataset.theme = effective;
    }

    function applyDeviceMode(mode) {
      const selected = mode || "auto";
      const effective = selected === "auto" ? getAutoDeviceMode() : selected;
      document.body.dataset.device = effective;
    }

    function loadBackgroundState() {
      const bgEnabled = localStorage.getItem("backgroundEnabled");
      document.body.classList.toggle("bg-off", bgEnabled === "false");
      const savedTheme = localStorage.getItem("themeMode") || "auto";
      const savedDevice = localStorage.getItem("deviceMode") || "auto";
      applyThemeMode(savedTheme);
      applyDeviceMode(savedDevice);
    }
    loadBackgroundState();
    window.addEventListener("resize", () => {
      if ((localStorage.getItem("themeMode") || "auto") === "auto") {
        applyThemeMode("auto");
      }
      if ((localStorage.getItem("deviceMode") || "auto") === "auto") {
        applyDeviceMode("auto");
      }
    });

    function saveSyncState(value, html, copyText = "") {
      localStorage.setItem("syncState", JSON.stringify({ value, html, copyText }));
    }

    function loadSyncState() {
      const saved = JSON.parse(localStorage.getItem("syncState") || "null");
      if (!saved) return;

      const enemyHitInput = document.getElementById("enemy-hit");
      if (enemyHitInput && saved.value) {
        enemyHitInput.value = saved.value;
      }
      if (saved.html) {
        const result = document.getElementById("result");
        result.innerHTML = saved.html;
        result.dataset.copyText = saved.copyText || "";
      }
    }

    function secToMMSS(sec) {
      sec = ((sec % 3600) + 3600) % 3600;
      const mm = String(Math.floor(sec / 60)).padStart(2, "0");
      const ss = String(sec % 60).padStart(2, "0");
      return mm + ss;
    }

    function buildSyncCopyText(allies, enemyHitSec) {
      return allies.map(a => {
        const departSec = enemyHitSec - a.march;
        const departMMSS = secToMMSS(departSec);
        return `${a.name}:${departMMSS}`;
      }).join("\n");
    }

    function runSyncCalculation() {
      const result = document.getElementById("result");
      result.innerHTML = "";
      result.dataset.copyText = "";

      const allies = JSON.parse(localStorage.getItem("allies") || "[]");
      if (allies.length === 0) {
        const message = "味方が登録されていません。味方リストで登録してください。";
        result.innerHTML = message;
        saveSyncState(document.getElementById("enemy-hit").value.trim(), message, "");
        return;
      }

      const mmss = document.getElementById("enemy-hit").value.trim();
      const normalized = mmss.replace(/\D/g, "");
      if (normalized.length !== 4) {
        const message = "MMSS形式で入力してください";
        result.innerHTML = message;
        saveSyncState(mmss, message, "");
        return;
      }

      const mm = Number(normalized.slice(0, 2));
      const ss = Number(normalized.slice(2, 4));
      const enemyHitSec = mm * 60 + ss;
      let html = "";

      allies.forEach(a => {
        const departSec = enemyHitSec - a.march;
        const departMMSS = secToMMSS(departSec);
        html += `<p class="sync-result-item">${a.name} → 出発UTC：${departMMSS}</p>`;
      });

      const copyText = buildSyncCopyText(allies, enemyHitSec);
      result.innerHTML = html;
      result.dataset.copyText = copyText;
      saveSyncState(mmss, html, copyText);
    }

    async function copySyncResults() {
      const result = document.getElementById("result");
      const copyText = result.dataset.copyText || "";
      if (!copyText) return;

      const button = document.getElementById("copy-sync");
      try {
        await navigator.clipboard.writeText(copyText);
        button.textContent = "コピーしました";
      } catch (error) {
        const fallback = document.createElement("textarea");
        fallback.value = copyText;
        document.body.appendChild(fallback);
        fallback.select();
        document.execCommand("copy");
        document.body.removeChild(fallback);
        button.textContent = "コピーしました";
      }

      setTimeout(() => {
        button.textContent = "クリップボードにコピー";
      }, 1500);
    }

    const autoHitUTC = localStorage.getItem("syncAutoHitUTC") || "";
    if (autoHitUTC) {
      document.getElementById("enemy-hit").value = autoHitUTC;
      runSyncCalculation();
    } else {
      loadSyncState();
    }

    document.getElementById("calc").onclick = runSyncCalculation;
    document.getElementById("copy-sync").onclick = copySyncResults;
  </script>

</body>
</html>
