<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>敵着弾計算ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>敵着弾計算ツール</h1>

  <section>
    <h2>現在の UTC 時刻</h2>
    <div id="utc-clock" class="clock"></div>
  </section>

  <section>
    <h2>敵の集結情報（複数可）</h2>

    <div id="enemy-list"></div>

    <button id="add-enemy" class="btn">＋ 敵を追加</button>
  </section>

  <section>
    <button id="calc" class="btn calc">計算する</button>
  </section>

  <section>
    <h2>計算結果</h2>
    <div id="result"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
