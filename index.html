<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>行軍同期ツール（UTC）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>行軍同期ツール（UTC）</h1>

  <section>
    <h2>現在の UTC 時刻</h2>
    <div id="utc-clock" class="clock"></div>
  </section>

  <section>
    <h2>行軍時間（ユーザーごと）</h2>

    <!-- ここにユーザー入力欄が追加される -->
    <div id="march-list"></div>

    <button id="add-user" class="btn">＋ ユーザー追加</button>
  </section>

  <section>
    <button id="calc" class="btn calc">計算する</button>
  </section>

  <section>
    <h2>計算結果</h2>
    <div id="result"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
