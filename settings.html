<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>設定</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav-bar">
    <a href="index.html">メニュー</a>
    <a href="enemy_list.html">相手リスト</a>
    <a href="ally_list.html">味方リスト</a>
    <a href="calc.html">着弾計算</a>
    <a href="ally_sync.html">差し込み計算</a>
    <a href="settings.html">設定</a>
  </nav>

  <h1>設定</h1>

  <section>
    <h2>背景設定</h2>
    <p id="bg-status"></p>
    <button id="bg-toggle" class="btn">背景を OFF にする</button>
  </section>

  <section>
    <h2>表示設定</h2>
    <p>カラーテーマ</p>
    <select id="theme-select" class="setting-select">
      <option value="auto">自動</option>
      <option value="light">ライト</option>
      <option value="dark">ダーク</option>
    </select>

    <p>画面モード</p>
    <select id="device-select" class="setting-select">
      <option value="auto">自動</option>
      <option value="mobile">スマホ</option>
      <option value="desktop">PC</option>
    </select>

    <p>スイッチ間隔（秒）</p>
    <input type="number" id="switch-interval" min="0" step="1" placeholder="例：15">
  </section>

  <script>
    function loadBackgroundState() {
      const bgEnabled = localStorage.getItem("backgroundEnabled");
      const state = bgEnabled !== "false"; // デフォルトON
      applyBackgroundState(state);
      updateButton(state);
    }

    function applyBackgroundState(enabled) {
      if (enabled) {
        document.body.classList.remove("bg-off");
        localStorage.setItem("backgroundEnabled", "true");
      } else {
        document.body.classList.add("bg-off");
        localStorage.setItem("backgroundEnabled", "false");
      }
    }

    function updateButton(enabled) {
      const btn = document.getElementById("bg-toggle");
      const status = document.getElementById("bg-status");
      if (enabled) {
        btn.textContent = "背景を OFF にする";
        status.textContent = "背景: ON";
      } else {
        btn.textContent = "背景を ON にする";
        status.textContent = "背景: OFF";
      }
    }

    function getAutoTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function getAutoDeviceMode() {
      return window.innerWidth <= 768 ? "mobile" : "desktop";
    }

    function applyThemeMode(mode) {
      const selected = mode || "auto";
      const effective = selected === "auto" ? getAutoTheme() : selected;
      document.body.dataset.theme = effective;
      localStorage.setItem("themeMode", selected);
      const themeSelect = document.getElementById("theme-select");
      if (themeSelect) themeSelect.value = selected;
    }

    function applyDeviceMode(mode) {
      const selected = mode || "auto";
      const effective = selected === "auto" ? getAutoDeviceMode() : selected;
      document.body.dataset.device = effective;
      localStorage.setItem("deviceMode", selected);
      const deviceSelect = document.getElementById("device-select");
      if (deviceSelect) deviceSelect.value = selected;
    }

    function applyVisualSettings() {
      const savedTheme = localStorage.getItem("themeMode") || "auto";
      const savedDevice = localStorage.getItem("deviceMode") || "auto";
      const switchIntervalInput = document.getElementById("switch-interval");
      const savedSwitchInterval = localStorage.getItem("switchIntervalSec");

      applyThemeMode(savedTheme);
      applyDeviceMode(savedDevice);

      if (switchIntervalInput) {
        switchIntervalInput.value = savedSwitchInterval !== null ? savedSwitchInterval : "0";
      }
    }

    function refreshAutoSettings() {
      if (localStorage.getItem("themeMode") === "auto") {
        applyThemeMode("auto");
      }
      if (localStorage.getItem("deviceMode") === "auto") {
        applyDeviceMode("auto");
      }
    }

    document.getElementById("bg-toggle").onclick = () => {
      const currentState = localStorage.getItem("backgroundEnabled") !== "false";
      const newState = !currentState;
      applyBackgroundState(newState);
      updateButton(newState);
    };

    document.getElementById("theme-select").onchange = (event) => {
      applyThemeMode(event.target.value);
    };

    document.getElementById("device-select").onchange = (event) => {
      applyDeviceMode(event.target.value);
    };

    document.getElementById("switch-interval").oninput = (event) => {
      const value = Number(event.target.value || 0);
      localStorage.setItem("switchIntervalSec", String(Math.max(0, Number.isFinite(value) ? value : 0)));
    };

    window.addEventListener("resize", () => {
      const savedTheme = localStorage.getItem("themeMode") || "auto";
      const savedDevice = localStorage.getItem("deviceMode") || "auto";
      if (savedTheme === "auto") {
        applyThemeMode("auto");
      }
      if (savedDevice === "auto") {
        applyDeviceMode("auto");
      }
    });

    loadBackgroundState();
    applyVisualSettings();
    refreshAutoSettings();
  </script>

</body>
</html>
